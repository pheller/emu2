name: Build and Release

on:
  push:
    branches: [master, main, script]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            arch: x86_64
            name: linux-x86_64
          - os: ubuntu-latest
            arch: i386
            name: linux-i386
          - os: ubuntu-latest
            arch: aarch64
            name: linux-aarch64

          # macOS builds
          - os: macos-latest
            arch: x86_64
            name: macos-x86_64
          - os: macos-latest
            arch: arm64
            name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux: Install cross-compilation tools if needed
      - name: Install Linux cross-compilation tools
        if: runner.os == 'Linux' && matrix.arch != 'x86_64'
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "i386" ]; then
            sudo apt-get install -y gcc-multilib
          elif [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      # Build for Linux x86_64 (native)
      - name: Build Linux x86_64
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          make clean
          make CFLAGS="-O3 -static"
          mv emu2 emu2-${{ matrix.name }}

      # Build for Linux i386
      - name: Build Linux i386
        if: runner.os == 'Linux' && matrix.arch == 'i386'
        run: |
          make clean
          make CFLAGS="-O3 -m32 -static" LDFLAGS="-m32"
          mv emu2 emu2-${{ matrix.name }}

      # Build for Linux aarch64
      - name: Build Linux aarch64
        if: runner.os == 'Linux' && matrix.arch == 'aarch64'
        run: |
          make clean
          make CC=aarch64-linux-gnu-gcc CFLAGS="-O3 -static"
          mv emu2 emu2-${{ matrix.name }}

      # Build for macOS (universal or specific arch)
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          make clean
          make CFLAGS="-O3 -arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}"
          mv emu2 emu2-${{ matrix.name }}

      # Run tests (only on native builds)
      - name: Run tests
        if: (runner.os == 'Linux' && matrix.arch == 'x86_64') || (runner.os == 'macOS' && matrix.arch == 'arm64')
        run: |
          cp emu2-${{ matrix.name }} emu2
          chmod +x test_script.sh
          ./test_script.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emu2-${{ matrix.name }}
          path: emu2-${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir"/* "release/$name"
            chmod +x "release/$name"
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
